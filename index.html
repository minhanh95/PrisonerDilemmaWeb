<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>PrisonerDilemma</title>
    <style>
      :root {
        --game-aspect-width: 1080;
        --game-aspect-height: 1920;
        --track: rgba(255, 255, 255, 0.28);
        --panel: rgba(3, 21, 30, 0.56);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #67d5ef url("bgr.png") center center / cover no-repeat fixed;
        font-family: Arial, Helvetica, sans-serif;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-frame {
        position: relative;
        width: min(100vw, calc(100vh * var(--game-aspect-width) / var(--game-aspect-height)));
        height: min(100vh, calc(100vw * var(--game-aspect-height) / var(--game-aspect-width)));
        max-width: 100vw;
        max-height: 100vh;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: rgba(35, 31, 32, 0.08);
        outline: none;
      }

      #unity-loading-bar {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 32px;
        background: linear-gradient(180deg, rgba(0, 28, 40, 0.18), rgba(0, 28, 40, 0.36));
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #unity-loading-bar.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #unity-logo {
        width: clamp(72px, 18vw, 132px);
        height: auto;
        filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.28));
      }

      #unity-progress-shell {
        width: min(68%, 360px);
        height: 12px;
        padding: 2px;
        border-radius: 999px;
        background: var(--track);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      }

      #unity-progress-bar {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #11c8ff, #63ffe2);
        transition: width 120ms ease-out;
      }

      #unity-loading-text {
        min-width: 56px;
        padding: 6px 10px;
        border-radius: 999px;
        color: #ffffff;
        background: var(--panel);
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
        text-align: center;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }

      @media (max-width: 480px) {
        #unity-loading-bar {
          gap: 16px;
          padding: 24px;
        }

        #unity-progress-shell {
          width: min(78%, 300px);
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-frame">
        <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
        <div id="unity-loading-bar" aria-live="polite">
          <img id="unity-logo" src="logo.png" alt="Logo">
          <div id="unity-progress-shell">
            <div id="unity-progress-bar"></div>
          </div>
          <div id="unity-loading-text">0%</div>
        </div>
      </div>
    </div>

    <script src="Build/Test.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBar = document.querySelector("#unity-progress-bar");
      const loadingText = document.querySelector("#unity-loading-text");

      function setProgress(progress) {
        const percent = Math.max(0, Math.min(100, Math.round(progress * 100)));
        progressBar.style.width = percent + "%";
        loadingText.textContent = percent + "%";
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/Test.data.unityweb",
        frameworkUrl: "Build/Test.framework.js.unityweb",
        codeUrl: "Build/Test.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MonoPoly",
        productName: "PrisonerDilemma",
        productVersion: "0.1.0"
      }, setProgress).then((unityInstance) => {
        setProgress(1);
        loadingBar.classList.add("is-hidden");
      }).catch((message) => {
        loadingText.textContent = "Load failed";
        alert(message);
      });
    </script>
  </body>
</html>
