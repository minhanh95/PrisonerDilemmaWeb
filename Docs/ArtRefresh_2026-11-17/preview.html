<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>CatBattle — loading art preview</title><base href="../../">
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("Fonts/Nunito-Bold.ttf") format("truetype");
        font-weight: 700;
        font-display: swap;
      }

      :root {
        --game-aspect-width: 1080;
        --game-aspect-height: 1920;
        --track: #e4ece5;
        --panel: #f6f4ef;
        --primary: #294d43;
        --ink: #253831;
        --line: #d9e0d8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #f6f4ef url("bgr.png?v=20261117") center center / cover no-repeat;
        font-family: "Nunito", Arial, sans-serif;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-frame {
        position: relative;
        width: min(100vw, calc(100vh * var(--game-aspect-width) / var(--game-aspect-height)));
        height: min(100vh, calc(100vw * var(--game-aspect-height) / var(--game-aspect-width)));
        max-width: 100vw;
        max-height: 100vh;
      }

      /* Mobile Safari/Chrome: 100vh includes the URL bar and cuts off the bottom of the game. */
      @supports (height: 100dvh) {
        #unity-frame {
          width: min(100vw, calc(100dvh * var(--game-aspect-width) / var(--game-aspect-height)));
          height: min(100dvh, calc(100vw * var(--game-aspect-height) / var(--game-aspect-width)));
          max-height: 100dvh;
        }
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        background: transparent;
        outline: none;
      }

      #unity-loading-bar {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 32px;
        background: linear-gradient(180deg, rgba(246, 244, 239, 0.3), rgba(246, 244, 239, 0.74));
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #unity-loading-bar.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #unity-logo {
        width: min(76%, 280px, 40vh);
        height: auto;
        filter: drop-shadow(0 8px 16px rgba(41, 77, 67, 0.12));
      }

      #unity-progress-shell {
        width: min(68%, 360px);
        height: 12px;
        padding: 2px;
        border-radius: 999px;
        background: var(--track);
        border: 1px solid var(--line);
        box-shadow: 0 3px 10px rgba(41, 77, 67, 0.08);
      }

      #unity-progress-bar {
        width: 57%;
        height: 100%;
        border-radius: inherit;
        background: var(--primary);
        transition: width 120ms ease-out;
      }

      #unity-loading-text {
        min-width: 56px;
        padding: 6px 10px;
        border-radius: 999px;
        color: var(--ink);
        background: var(--panel);
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
        text-align: center;
        border: 1px solid var(--line);
      }

      @media (max-width: 480px) {
        #unity-loading-bar {
          gap: 16px;
          padding: 24px;
        }

        #unity-progress-shell {
          width: min(78%, 300px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #unity-loading-bar,
        #unity-progress-bar {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-frame">
        <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
        <div id="unity-loading-bar" aria-live="polite">
          <img id="unity-logo" src="logo.png?v=20261117" alt="CatBattle" width="1254" height="1254" decoding="async" fetchpriority="high">
          <div id="unity-progress-shell">
            <div id="unity-progress-bar"></div>
          </div>
          <div id="unity-loading-text">57%</div>
        </div>
      </div>
    </div>



  </body>
</html>
